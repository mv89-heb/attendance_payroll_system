<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עמדת החתמת נוכחות</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <style>
        body { background-color: #121212; color: #fff; font-family: system-ui, sans-serif; min-height: 100vh; }
        .kiosk-card { background-color: #1e1e1e; border-radius: 16px; border: 1px solid #2d2d2d; }
        .pin-btn { background-color: #2a2a2a; color: #fff; border: 1px solid #3d3d3d; font-size: 1.5rem; height: 64px; border-radius: 50%; width: 64px; transition: 0.2s; }
        .pin-btn:active { background-color: #444; }
        .clock-display { font-size: 3rem; font-weight: bold; letter-spacing: 2px; color: #00f0ff; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="container" style="max-width: 480px;">
        <div class="card kiosk-card shadow p-4 text-center">
            <h2 class="mb-2">עמדת נוכחות דיגיטלית ⏱️</h2>
            <div id="clock" class="clock-display mb-4">00:00:00</div>

            <!-- Step 1: Authentication Screen -->
            <div id="step-auth">
                <div class="mb-3">
                    <input type="text" id="emp-num" class="form-control form-control-lg bg-dark text-white text-center border-secondary" placeholder="מספר עובד" autocomplete="off">
                </div>
                <div class="mb-3">
                    <input type="password" id="pin-display" class="form-control form-control-lg bg-dark text-white text-center border-secondary" placeholder="קוד PIN" readonly>
                </div>

                <!-- PIN Pad -->
                <div class="d-flex flex-column gap-2 align-items-center mb-4">
                    <div class="d-flex gap-3">
                        <button class="pin-btn" onclick="pressKey('1')">1</button>
                        <button class="pin-btn" onclick="pressKey('2')">2</button>
                        <button class="pin-btn" onclick="pressKey('3')">3</button>
                    </div>
                    <div class="d-flex gap-3">
                        <button class="pin-btn" onclick="pressKey('4')">4</button>
                        <button class="pin-btn" onclick="pressKey('5')">5</button>
                        <button class="pin-btn" onclick="pressKey('6')">6</button>
                    </div>
                    <div class="d-flex gap-3">
                        <button class="pin-btn" onclick="pressKey('7')">7</button>
                        <button class="pin-btn" onclick="pressKey('8')">8</button>
                        <button class="pin-btn" onclick="pressKey('9')">9</button>
                    </div>
                    <div class="d-flex gap-3">
                        <button class="pin-btn btn-danger text-white fs-5" onclick="clearPIN()">C</button>
                        <button class="pin-btn" onclick="pressKey('0')">0</button>
                        <button class="pin-btn btn-success text-white fs-5" onclick="verifyPIN()">✓</button>
                    </div>
                </div>
            </div>

            <!-- Step 2: Domain & Action Selection -->
            <div id="step-action" class="d-none">
                <h4 class="text-success mb-3" id="welcome-msg">שלום, עובד</h4>
                <div class="mb-4">
                    <label for="domain-select" class="form-label text-muted">בחר תחום עבודה נוכחי</label>
                    <select class="form-select form-select-lg bg-dark text-white border-secondary" id="domain-select"></select>
                </div>
                <div class="d-flex gap-3">
                    <button class="btn btn-success btn-lg w-100 py-3" onclick="submitPunch('IN')">כניסה (IN)</button>
                    <button class="btn btn-danger btn-lg w-100 py-3" onclick="submitPunch('OUT')">יציאה (OUT)</button>
                </div>
                <button class="btn btn-outline-secondary btn-sm mt-4 w-100" onclick="resetKiosk()">ביטול וחזרה</button>
            </div>

            <!-- Step 3: Success Feedback Screen -->
            <div id="step-success" class="d-none py-4">
                <div class="text-success fs-1 mb-3">✓</div>
                <h3 class="mb-2">ההחתמה נקלטה בהצלחה!</h3>
                <p class="text-muted" id="feedback-msg">הנתונים נרשמו במערכת.</p>
            </div>

            <!-- Global Error Display -->
            <div id="error-msg" class="alert alert-danger py-2 mt-3 d-none" role="alert">שגיאה</div>
        </div>
    </div>

    <script>
        let currentPIN = "";

        setInterval(() => {
            const now = new Date();
            document.getElementById("clock").innerText = now.toTimeString().split(" ")[0];
        }, 1000);

        function pressKey(num) {
            if (currentPIN.length < 6) {
                currentPIN += num;
                document.getElementById("pin-display").value = "*".repeat(currentPIN.length);
            }
        }

        function clearPIN() {
            currentPIN = "";
            document.getElementById("pin-display").value = "";
            hideError();
        }

        function showError(msg) {
            const errDiv = document.getElementById("error-msg");
            errDiv.innerText = msg;
            errDiv.classList.remove("d-none");
        }

        function hideError() {
            document.getElementById("error-msg").classList.add("d-none");
        }

        function verifyPIN() {
            const empNum = document.getElementById("emp-num").value.trim();
            if (!empNum || currentPIN.length === 0) {
                showError("נא להזין מספר עובד וקוד PIN");
                return;
            }
            hideError();

            fetch("/kiosk/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ employee_number: empNum, pin: currentPIN })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(data => { throw new Error(data.error || "פרטי זיהוי לא נכונים"); });
                }
                return res.json();
            })
            .then(data => {
                document.getElementById("welcome-msg").innerText = "שלום, " + data.employee.name;
                
                const select = document.getElementById("domain-select");
                select.innerHTML = "";
                data.domains.forEach(d => {
                    const opt = document.createElement("option");
                    opt.value = d.id;
                    opt.innerText = d.name + " (" + d.code + ")";
                    select.appendChild(opt);
                });

                document.getElementById("step-auth").classList.add("d-none");
                document.getElementById("step-action").classList.remove("d-none");
            })
            .catch(err => {
                showError(err.message || "זיהוי נכשל. ודא שמספר העובד וה-PIN נכונים.");
                clearPIN();
            });
        }

        function submitPunch(type) {
            const domainId = document.getElementById("domain-select").value;
            if (!domainId) return;

            fetch("/kiosk/punch", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ domain_id: domainId, punch_type: type })
            })
            .then(res => {
                if (!res.ok) return res.json().then(d => { throw new Error(d.error); });
                return res.json();
            })
            .then(data => {
                document.getElementById("step-action").classList.add("d-none");
                document.getElementById("step-success").classList.remove("d-none");
                
                setTimeout(resetKiosk, 4000);
            })
            .catch(err => {
                showError(err.message || "כשל ברישום ההחתמה");
            });
        }

        function resetKiosk() {
            currentPIN = "";
            document.getElementById("emp-num").value = "";
            document.getElementById("pin-display").value = "";
            document.getElementById("step-success").classList.add("d-none");
            document.getElementById("step-action").classList.add("d-none");
            document.getElementById("step-auth").classList.remove("d-none");
            hideError();
            
            // איפוס סשן בשרת
            fetch("/kiosk/reset", { method: "POST" });
        }
    </script>
</body>
</html>
